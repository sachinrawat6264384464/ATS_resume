version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resumeiq_postgres
    restart: always
    environment:
      POSTGRES_USER: resumeiq_user
      POSTGRES_PASSWORD: resumeiq_secure_password
      POSTGRES_DB: resumeiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeiq_user -d resumeiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resumeiq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeiq_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://resumeiq_user:resumeiq_secure_password@postgres:5432/resumeiq_db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
      - MAX_UPLOAD_SIZE_MB=10
      - RATE_LIMIT_PER_MINUTE=60
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeiq_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -c 2
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://resumeiq_user:resumeiq_secure_password@postgres:5432/resumeiq_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:8000
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeiq_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: resumeiq_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

